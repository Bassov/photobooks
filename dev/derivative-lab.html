<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Derivative lab (dev)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #d7d7d7;
        color: #232223;
        font:
          12px/1.4 system-ui,
          sans-serif;
      }
      #lab {
        box-sizing: border-box;
        height: 100%;
        overflow: auto;
        padding: 16px;
      }
      h1,
      h2 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      .lab-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 8px;
        margin-bottom: 16px;
      }
      figure {
        margin: 0;
        padding: 4px;
        background: #e1e1e1;
      }
      /* 1:1 centre crop: encoder artefacts at native pixels. */
      figure img {
        display: block;
        width: 100%;
        height: 160px;
        object-fit: none;
      }
      figcaption {
        padding-top: 4px;
        font-variant-numeric: tabular-nums;
      }
      pre {
        overflow: auto;
        background: #e1e1e1;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <main id="lab">
      <h1>Derivative lab: size × format × quality on hard fixtures</h1>
    </main>
    <script type="module" src="/src/derivatives/lab/main.ts"></script>
  </body>
</html>
