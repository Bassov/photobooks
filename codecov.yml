coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 1%
    patch:
      default:
        informational: true

flag_management:
  default_rules:
    carryforward: true

comment:
  layout: 'reach,diff,flags,files'
  behavior: default
  require_changes: false
  require_base: false

ignore:
  - 'e2e/**'
  - 'scripts/**'
  - 'src/**/*.{bench,benchmark}.{ts,tsx}'
  - 'src/**/*.d.ts'
  - 'src/**/*.test-helpers.ts'
  - 'src/main.tsx'

flags:
  unit:
    paths:
      - src/
    carryforward: true
