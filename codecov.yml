# Two coverage uploads per commit: unit lcov + e2e lcov.
# e2e carryforward is false so a prior commit cannot satisfy after_n_builds early.
codecov:
  notify:
    after_n_builds: 2

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
      floor:
        target: 80%
        threshold: 0%
    patch:
      default:
        target: 85%
        threshold: 0%

bundle_analysis:
  warning_threshold: '5%'
  status: informational

flag_management:
  default_rules:
    carryforward: true

comment:
  # Two uploads per commit (unit + e2e); must match notify.after_n_builds.
  after_n_builds: 2
  # flags requested; Codecov on this repo still omits the Flags table in GitHub comments
  # (same class as project/components — see docs/backlog/codecov-project-components.md).
  layout: 'header, diff, flags, files'
  behavior: default
  require_changes: false
  require_base: false

component_management:
  individual_components:
    - component_id: photo
      name: photo
      paths:
        - src/photo/**
    - component_id: perf
      name: perf
      paths:
        - src/perf/**
    - component_id: lib
      name: lib
      paths:
        - src/lib/**
    - component_id: editor
      name: editor
      paths:
        - src/editor/**
    - component_id: project
      name: project
      paths:
        - src/project/**
    - component_id: assets
      name: assets
      paths:
        - src/assets/**
    - component_id: render
      name: render
      paths:
        - src/render/**
    - component_id: core
      name: core
      paths:
        - src/core/**
    - component_id: scripts
      name: scripts
      paths:
        - scripts/**

ignore:
  - 'e2e/**'
  - 'src/**/*.{bench,benchmark}.{ts,tsx}'
  - 'src/**/*.d.ts'
  - 'src/**/*.test-helpers.ts'
  - 'src/main.tsx'

flags:
  unit:
    paths:
      - src/
      - scripts/
    carryforward: true
  e2e:
    paths:
      - src/
    # Must upload on every commit; carryforward would satisfy after_n_builds early.
    carryforward: false
