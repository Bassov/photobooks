pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{js,ts,tsx,mjs,cjs}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: '*.{js,ts,tsx,mjs,cjs,json,md,yml,yaml,css,html}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    verify:
      # Stamp-aware: skip A+C1 only when AGENT_THIN_FINISH=1 (agent finish) + stage-11 stamp.
      # Hand-push always runs integrity && check:fast. Canary fails if tests mutate this repo.
      run: pnpm exec ts-rig-ci hook-pre-push
