pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{js,ts,tsx,mjs,cjs}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: '*.{js,ts,tsx,mjs,cjs,json,md,yml,yaml,css,html}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    verify:
      run: pnpm verify:fast
