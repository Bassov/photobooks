schema: spec-driven

context: |
  Language: en
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Product: Photobooks — local-first photobook editor (Vite + React 19 + TypeScript).
  Package manager: pnpm only. Repo language: English. Do not commit `.local_dev/`.

  Agent loop orchestration (stages, A/B/C, commit/stamp/finish): `docs/agent-loop.md` only.

  Quality bar:
  - TypeScript strict + exactOptionalPropertyTypes + noUncheckedIndexedAccess; ESLint strict-type-checked + stylistic-type-checked with --max-warnings=0
  - Property-based tests via @fast-check/vitest (numRuns ~100 local; higher in CI)
  - Perf: Lighthouse CI budgets (budget.json); 60 fps proxies — zero LoAF, handler p95 ≤ 2 ms, INP ≤ 100 ms (`src/perf/budgets.ts`); `pnpm perf`
  - Heavy work (decode/render/imposition) MUST run in Web Workers, never on the main thread
  - Tests MUST exercise public module/component APIs; no private/`as any`/deep-internal hacks
  - Shared factories, fixtures, and helpers; mock I/O boundaries only
  - Detailed test style: skill `write-tests`
  - Repeated review finding → automated check in the same change. No findings journal
  - NEVER weaken a quality gate. Only budgeted `// Stryker disable next-line …: <reason>` within mutation.disableBudget
  - Necessary minimum (artifacts + prod code): reuse ladder exists → codebase → platform → installed dep → new code. Tests are exempt
  - UI in scope: tokens/primitives from docs/design.md (add new ones in the same change); evidenced browser smoke + skill `ui-review` before push/archive
  - Scripts/CI/.cursor-only changes: always `skip_specs: true` (no product-spec deltas)

  Doc budget:
  - Artifact mandates (rules + operations) live in this file. Loop orchestration lives only in `docs/agent-loop.md`. Do not duplicate either in AGENTS.md or alwaysApply Cursor rules.
  - AGENTS.md is a navigation map. Product specs under openspec/specs/ are behavior SoT for `src/` capabilities. Tooling/CI behavior: @albasov/ts-agent-rig, quality/gates.json, .cursor/ — not openspec/specs prose mirrors.
  - Durable docs: docs/agent-loop.md; docs/design.md; docs/future-architecture.md; docs/roadmap.md + docs/roadmap/ via `pnpm roadmap` (skill `roadmap`)

  Security surface (tag changes that touch these):
  - File System Access, workers/postMessage, blob/object URLs, CSP/headers, dependency bumps, export pipelines

rules:
  proposal:
    - '≤80 words / ≤15 lines. Link docs/roadmap/<M>/<slug>.md (and UI ref if any) as scope/acceptance SoT. List only Scope out (2–3 bullets) and Delta/Risk (1–2 if clarifying the item). Do not restate Why / Scope in / Browser check / Perf from the roadmap file.'
    - 'Necessary minimum: only what the item needs; N/A in one line. Tests are exempt.'
    - 'Size guidance (advisory): at most ONE new subsystem and at most 8 tasks; line-count target/prefer-max in docs/roadmap/RULES.md "Change size". Prefer `pnpm roadmap add --after` when oversized — check/CI never fail on size.'
    - 'Over guidance: before design/apply, prefer narrowing + `pnpm roadmap add <slug> --after <current> --tag prep|feature|contingency --title "…"`.'
    - 'Two-speed: [feature] → compact proposal + design + tasks (+ specs only if domain contract changes) + openspec-planning-reviewer once. [prep]/[contingency] with concrete ## Scope + Done when → brief proposal+tasks; skip design.md unless arch/security; skip_specs:true when no src/ capability behavior change; skip planning-reviewer — except when the item introduces a missing src/<capability>/ (full design + planning-reviewer; isPrepFastTrack false).'
    - 'If UI is in scope, Delta/Risk or success notes MUST name empty + happy + primary interact/scroll observables e2e will lock in.'
    - 'If a scrollport is in scope, state: no page-level H/V scroll; scrolling only inside the named scrollport(s).'
    - 'If the security surface is in scope, Delta/Risk MUST include an explicit security bullet.'
  design:
    - 'Only two sections (≤250 words): ## Decisions (numbered, after reading the codebase) and ## Touch-set & Test Plan (files, reuse, unit/PBT/e2e lock-ins). Drop Context / Goals / Non-Goals padding.'
    - 'Necessary minimum: write design.md only for real decisions; N/A in one line. Prefer reuse ladder. Tests are exempt.'
    - 'Every quality-gate config edit MUST appear in the touch-set with a reason.'
    - 'When UI is in scope, name tokens/primitives from docs/design.md (add new ones there same change); empty / happy / scroll-or-interact e2e cases; skill `ui-review` before push.'
    - 'If heavy image/decode/render/encode work is in scope, MUST place it in Web Workers.'
    - 'If the security surface is in scope, Decisions MUST cover permission/security handling.'
    - 'After proposal+design+tasks(+specs), launch `openspec-planning-reviewer` once (brief `--out`; ≤1 re-review). Docs-only skips design checklist. Prep/contingency fast-track: skip.'
  tasks:
    - Break work into small, checkable tasks.
    - 'At most 8 implementation tasks. More means split with `pnpm roadmap add --after` instead of inflating tasks.'
    - 'tasks.md has ## Implementation (feature work only) and ## Manual test scenarios only. Do NOT put loop rituals (check:fast, B, manual-qa, stamp, finish) or a Verification checklist in Implementation — those are `docs/agent-loop.md` / CI.'
    - '## Manual test scenarios: scenario list (or N/A) + paste OK/problem lines from stage-9 `pnpm agent manual-qa`. Not an Implementation checkbox. Copy into the PR body when drafting.'
    - 'Do not add a tasks.md stryker/survivors item — kill mutants with public-API tests or budgeted `// Stryker disable next-line …: <reason>`; optional leftover notes go in the PR Skipped/risk section only.'
    - 'Tick Implementation boxes with test/link/commit evidence when completing tasks.'
  specs:
    - 'Keep openspec/specs/ for `src/` product capabilities only. Tooling/CI/agent changes: skip_specs: true.'
    - 'Prefer concise invariants + single-line requirements; reserve WHEN/THEN for core user/contract flows.'
    - 'Budget ≤250 lines soft / ≤400 hard per capability spec.md (quality/gates.json openspecSpecs). Split rather than append.'
    - 'Default skip_specs: true for internal refactors, perf tuning, or bug fixes whose contract is already in the capability spec.'

operations:
  apply:
    guidance:
      - 'Follow `docs/agent-loop.md` for orchestration (when to run A/B, commit, reviewers, stamp, finish). Do not restate stages here.'
      - 'Before archive, for each reviewer finding tagged `[repeat]` add the named automated check (or area SHALL / code comment when infeasible) in the same change.'
      - 'If this change fixes a bug found via exploratory or MCP browser interaction, include a Playwright test under e2e/ covering that failure mode.'
      - 'When a change introduces or changes an in-app scrollport, include Playwright `assertDocumentFitsViewport` / `assertNamedScrollport` before apply-complete.'
      - 'When UI is in scope: before push/archive, skill `ui-review` + evidenced browser smoke (empty + happy + primary scroll/interact). Prefer Playwright; MCP screenshots are supporting evidence.'
      - 'Require evidenced openspec-planning-reviewer pass before apply (docs-only skips design checklist), except prep/contingency fast-track (roadmap item is the plan; keep implementation-reviewer).'
      - 'If apply will exceed size guidance (~1000 / prefer ≤1500; advisory), prefer `pnpm roadmap add <slug> --after <current>` rather than enlarging the PR.'
      - 'Survived/no-coverage mutants that encode specified behavior: add public-API tests, or delete dead code, or use budgeted `// Stryker disable next-line …: <reason>`. Free-text in tasks.md does not justify a survivor; do not add a stryker item there. Optional notes → PR Skipped/risk only.'
      - 'Run pnpm audit:ci when package.json, the lockfile, or a security-tagged change is in scope.'
      - 'Blocking (critical/high) findings MUST be fixed or scheduled with `pnpm roadmap add --after <current>`; the PR body records verdicts and dispositions.'
      - Do not archive while critical or high review findings remain open.
      - Do not push a UI-scoped PR when empty/happy/scroll smoke is missing or failing.
  archive:
    guidance:
      - Archive only after openspec-implementation-reviewer returned pass.
      - 'Archive only after blocking critical/high findings are fixed or scheduled; PR body records verdicts.'
      - 'Archive only after Manual check and docs/rules sync are done (orchestration: `docs/agent-loop.md`).'
      - 'Before moving the change, grep README.md, AGENTS.md, .cursor/rules, docs/ for terms the change touched; fix drift or note "No doc changes".'
      - ALWAYS sync delta specs into main openspec/specs/ before archiving (inline sync, then verify merge).
      - NEVER skip-sync when delta specs exist.
      - If sync is blocked or verification fails, STOP — do not archive until fixed.
      - 'If there are no delta specs, archive may proceed; note "No delta specs".'
      - 'Use `pnpm agent archive <slug>` (native; no openspec CLI), then `pnpm roadmap done <slug>` (`--note` when scope differs; contingency not-needed note required).'
      - Summarize what merged into specs/ in a few bullets.
