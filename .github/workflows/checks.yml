name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dependency boundaries
        run: pnpm deps

      - name: Unused code (knip)
        run: pnpm knip

      - name: Format check
        run: pnpm format:check

      - name: Unit and property tests
        run: pnpm test:coverage
        env:
          FC_NUM_RUNS: '200'

      - name: Coverage summary
        if: always()
        id: coverage_summary
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            node scripts/coverage-step-summary.mjs
            exit 0
          fi
          echo "has_report=true" >> "$GITHUB_OUTPUT"
          node scripts/coverage-step-summary.mjs | tee /tmp/coverage-pr-comment.md

      - name: Sticky coverage comment
        if: always() && steps.coverage_summary.outputs.has_report == 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage-summary
          path: /tmp/coverage-pr-comment.md

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit:ci

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
