name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deterministic checks
        # Unit suite runs once below via test:coverage; skip unit here.
        run: pnpm check --verbose --skip-unit

      - name: Format check
        run: pnpm format:check

      - name: Unit and property tests
        id: unit
        run: pnpm test:coverage
        env:
          FC_NUM_RUNS: '200'

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('reports/vitest-junit.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: reports/vitest-junit.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

      - name: Coverage summary
        if: always()
        run: node scripts/coverage-step-summary.mjs | tee /tmp/coverage-pr-comment.md

      - name: Pack coverage section
        if: always()
        run: |
          node scripts/ci-report-comment.mjs pack \
            --section coverage \
            --step-outcome "${{ steps.unit.outcome }}" \
            --missing-report job-failed \
            --report coverage/coverage-summary.json \
            --body-file /tmp/coverage-pr-comment.md \
            --out ci-section/section.json

      - name: Upload coverage section
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-section-coverage
          path: ci-section/section.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Build
        run: pnpm build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Assert dist isolation headers
        run: node scripts/assert-dist-headers.mjs

      - name: Dependency audit
        run: pnpm audit:ci

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

  ci-comment:
    needs: checks
    if: always() && github.event_name == 'pull_request' && needs.checks.result != 'cancelled'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-report-${{ github.event.pull_request.number }}
      queue: max
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download coverage section
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ci-section-coverage
          path: ci-section

      - name: Update CI report comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-report-comment.mjs apply --section coverage --artifact ci-section/section.json
