name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base for merge-base gates
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref || 'main' }}"
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/main"

      - name: Setup Node and pnpm
        uses: Bassov/ts-agent-rig/.github/actions/setup-node-pnpm@v0.2.1

      - name: Deterministic checks
        # Unit suite runs once below via test:coverage; skip unit here.
        # PR body carries Owner-approved waivers for pin / ratchet (git log alone is not enough in CI).
        env:
          PR_POLICY_BODY: ${{ github.event.pull_request.body }}
          PR_POLICY_BRANCH: ${{ github.head_ref }}
        run: pnpm check --verbose --skip-unit

      - name: Format check
        run: pnpm format:check

      - name: Unit and property tests
        id: unit
        run: pnpm test:coverage
        env:
          FC_NUM_RUNS: '200'

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('reports/vitest-junit.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: reports/vitest-junit.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

      - name: Coverage summary
        if: always()
        run: pnpm exec ts-rig-ci coverage-summary | tee /tmp/coverage-pr-comment.md

      - name: Pack coverage section
        if: always()
        uses: Bassov/ts-agent-rig/.github/actions/report-section-pack@v0.2.1
        with:
          section: coverage
          step-outcome: ${{ steps.unit.outcome }}
          missing-report: job-failed
          report: coverage/coverage-summary.json
          body-file: /tmp/coverage-pr-comment.md
          artifact-name: ci-section-coverage

      - name: Build
        run: pnpm build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Assert app bundle has no uikit modules
        run: pnpm assert:no-uikit-in-app

      - name: Assert dist isolation headers
        run: node scripts/assert-dist-headers.mjs

      - name: Dependency audit
        run: pnpm audit:ci

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: unit
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

  ci-comment:
    needs: checks
    if: always() && github.event_name == 'pull_request' && needs.checks.result != 'cancelled'
    uses: Bassov/ts-agent-rig/.github/workflows/ci-report-comment.yml@v0.2.1
    with:
      section: coverage
      artifact-name: ci-section-coverage
    secrets: inherit
