name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dependency boundaries
        run: pnpm deps

      - name: Unused code (knip)
        run: pnpm knip

      - name: Format check
        run: pnpm format:check

      - name: Unit and property tests
        run: pnpm test:coverage
        env:
          FC_NUM_RUNS: '200'

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('reports/vitest-junit.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: reports/vitest-junit.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

      - name: Coverage summary
        if: always()
        id: coverage_summary
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            echo "summary=No report" >> "$GITHUB_OUTPUT"
            node scripts/coverage-step-summary.mjs > /tmp/coverage-pr-comment.md
          else
            echo "has_report=true" >> "$GITHUB_OUTPUT"
            node scripts/coverage-step-summary.mjs | tee /tmp/coverage-pr-comment.md
            LINE_COV=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total.lines.pct")
            echo "summary=Lines: ${LINE_COV}%" >> "$GITHUB_OUTPUT"
          fi

      - name: Update consolidated CI comment
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          STATUS="${{ steps.coverage_summary.outputs.has_report == 'true' && 'success' || 'pending' }}"
          node scripts/update-consolidated-ci-comment.mjs \
            coverage \
            "$STATUS" \
            /tmp/coverage-pr-comment.md \
            "${{ steps.coverage_summary.outputs.summary }}"

      - name: Build
        run: pnpm build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Assert dist isolation headers
        run: node scripts/assert-dist-headers.mjs

      - name: Dependency audit
        run: pnpm audit:ci

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
