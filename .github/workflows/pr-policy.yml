# Gate ratchet: workflow + script execute from the PR *base* ref only.
# Head is fetched as git objects and parsed as data — never installed or executed.
name: pr-policy

on:
  pull_request_target:
    # `edited` stays: the waiver token is read from the event's PR body.
    types: [opened, synchronize, reopened, ready_for_review, edited]

# Queue, don't cancel: a body edit must not leave a cancelled (red) run behind.
concurrency:
  group: pr-policy-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pr-policy:
    uses: Bassov/ts-agent-rig/.github/workflows/pr-policy.yml@v0.2.21
    secrets: inherit
