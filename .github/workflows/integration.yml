name: integration

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-burn-in:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_targets: ${{ steps.burn-in-targets.outputs.has_targets }}
      count: ${{ steps.burn-in-count.outputs.count }}
      outcome: ${{ steps.finalize.outputs.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve burn-in count
        id: burn-in-count
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          COUNT="$(node scripts/e2e-burn-in-count-cli.mjs)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Burn-in count: $COUNT"

      - name: Resolve burn-in targets
        id: burn-in-targets
        env:
          STRYKER_DIFF_BASE: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          TARGETS="$(node scripts/e2e-burn-in-targets-cli.mjs | tr '\n' ' ')"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          if [ -z "$(echo "$TARGETS" | tr -d '[:space:]')" ]; then
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            echo "No burn-in targets"
          else
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
            echo "Burn-in targets: $TARGETS"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.burn-in-targets.outputs.has_targets == 'true'
        with:
          version: 10.28.0

      - name: Install dependencies
        if: steps.burn-in-targets.outputs.has_targets == 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        if: steps.burn-in-targets.outputs.has_targets == 'true'
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.burn-in-targets.outputs.has_targets == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.burn-in-targets.outputs.has_targets == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E burn-in
        if: steps.burn-in-targets.outputs.has_targets == 'true'
        id: burn-in
        run: >
          node scripts/with-playwright-env.mjs pnpm exec playwright test
          --project=chromium
          ${{ steps.burn-in-targets.outputs.targets }}
          --repeat-each=${{ steps.burn-in-count.outputs.count }}
          --retries=0
          --workers=1
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/burn-in-results.json

      - name: Finalize burn-in meta
        if: always()
        id: finalize
        run: |
          mkdir -p burn-in-meta
          HAS="${{ steps.burn-in-targets.outputs.has_targets }}"
          COUNT="${{ steps.burn-in-count.outputs.count }}"
          if [ "$HAS" = "true" ]; then
            OUTCOME="${{ steps.burn-in.outcome }}"
            printf '%s\n' "true" > burn-in-meta/has_targets.txt
            if [ -f test-results/burn-in-results.json ]; then
              cp test-results/burn-in-results.json burn-in-meta/burn-in-results.json
            fi
          else
            OUTCOME="skipped"
            printf '%s\n' "false" > burn-in-meta/has_targets.txt
            printf '%s\n' "no targets" > burn-in-meta/status.txt
          fi
          printf '%s\n' "$COUNT" > burn-in-meta/count.txt
          printf '%s\n' "$OUTCOME" > burn-in-meta/outcome.txt
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"

      - name: Upload burn-in meta
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: burn-in-meta
          path: burn-in-meta/
          retention-days: 1
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E
        id: e2e
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e-results.json

      - name: E2E coverage harvest
        id: e2e-coverage
        if: success()
        run: >
          pnpm test:e2e
          --grep-invert "frame-budget gates"
        env:
          # webServer sets VITE_COVERAGE=1; skip LoAF describes (Istanbul overhead).
          E2E_COVERAGE: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e-coverage-results.json

      - name: Merge e2e coverage
        id: e2e-coverage-merge
        if: always() && steps.e2e-coverage.outcome == 'success'
        run: |
          pnpm coverage:e2e
          test -s coverage-e2e/lcov.info

      - name: Upload e2e coverage to Codecov
        if: always() && steps.e2e-coverage-merge.outcome == 'success'
        uses: codecov/codecov-action@v7
        with:
          files: coverage-e2e/lcov.info
          flags: e2e
          # Prevent picking up Playwright JSON under test-results/ as "coverage".
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

      - name: Upload e2e results
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/e2e-results.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload frame-pacing stats (report-only)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-frame-stats
          path: test-results/**/perf-frame-stats.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-flaky-resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_targets: ${{ steps.flaky.outputs.has_targets }}
      count: ${{ steps.flaky.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve @flaky list
        id: flaky
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from 'node:fs'
          import { loadFlakySpecPaths } from './scripts/e2e-flaky-list.mjs'
          const paths = loadFlakySpecPaths()
          const has = paths.length > 0
          appendFileSync(process.env.GITHUB_OUTPUT, `has_targets=${has}\n`)
          appendFileSync(process.env.GITHUB_OUTPUT, `count=${paths.length}\n`)
          console.log(`@flaky list count=${paths.length}`)
          EOF

  e2e-flaky:
    needs: [e2e-flaky-resolve]
    if: needs.e2e-flaky-resolve.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E @flaky
        run: pnpm test:e2e:flaky
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e-flaky-results.json

  # Required check name stays `integration`: fails unless full e2e succeeded,
  # burn-in succeeded (or was skipped on non-PR), and e2e-flaky succeeded
  # (empty @flaky list skips e2e-flaky — skipped is OK).
  integration:
    needs: [e2e, e2e-burn-in, e2e-flaky-resolve, e2e-flaky]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require e2e, burn-in, and e2e-flaky
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
          BURN_IN_RESULT: ${{ needs.e2e-burn-in.result }}
          FLAKY_RESOLVE_RESULT: ${{ needs.e2e-flaky-resolve.result }}
          FLAKY_RESULT: ${{ needs.e2e-flaky.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$E2E_RESULT" != "success" ]; then
            echo "e2e job result=$E2E_RESULT (need success)"
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$BURN_IN_RESULT" != "success" ]; then
              echo "e2e-burn-in job result=$BURN_IN_RESULT (need success on pull_request)"
              exit 1
            fi
          else
            if [ "$BURN_IN_RESULT" != "success" ] && [ "$BURN_IN_RESULT" != "skipped" ]; then
              echo "e2e-burn-in job result=$BURN_IN_RESULT (need success or skipped on non-PR)"
              exit 1
            fi
          fi
          if [ "$FLAKY_RESOLVE_RESULT" != "success" ]; then
            echo "e2e-flaky-resolve job result=$FLAKY_RESOLVE_RESULT (need success)"
            exit 1
          fi
          if [ "$FLAKY_RESULT" != "success" ] && [ "$FLAKY_RESULT" != "skipped" ]; then
            echo "e2e-flaky job result=$FLAKY_RESULT (need success or skipped)"
            exit 1
          fi
          echo "integration gate ok (e2e=$E2E_RESULT burn-in=$BURN_IN_RESULT flaky-resolve=$FLAKY_RESOLVE_RESULT flaky=$FLAKY_RESULT)"

  ci-comment:
    needs: [e2e, e2e-burn-in, e2e-flaky, integration]
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.e2e.result != 'cancelled' &&
      needs.e2e-burn-in.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ci-report-${{ github.event.pull_request.number }}
      queue: max
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download e2e results
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: e2e-results
          path: e2e-download

      - name: Download burn-in meta
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: burn-in-meta
          path: burn-in-meta

      - name: Summarize and pack e2e section
        env:
          E2E_STEP_OUTCOME: ${{ needs.e2e.result }}
        run: |
          mkdir -p ci-section
          EXTRA_ARGS=()
          if [ -f burn-in-meta/has_targets.txt ] && [ "$(cat burn-in-meta/has_targets.txt)" = "true" ]; then
            EXTRA_ARGS+=(--burn-in "$(cat burn-in-meta/count.txt)")
            EXTRA_ARGS+=(--burn-in-outcome "$(cat burn-in-meta/outcome.txt)")
            if [ -f burn-in-meta/burn-in-results.json ]; then
              EXTRA_ARGS+=(--burn-in-report burn-in-meta/burn-in-results.json)
            fi
          fi
          STEP_OUTCOME=failure
          if [ "$E2E_STEP_OUTCOME" = "success" ]; then
            STEP_OUTCOME=success
          fi
          if [ -f e2e-download/e2e-results.json ]; then
            node scripts/e2e-playwright-summary-cli.mjs \
              --report e2e-download/e2e-results.json \
              "${EXTRA_ARGS[@]}" \
              --out /tmp/e2e-pr-comment.md
            node scripts/ci-report-comment.mjs pack \
              --section e2e \
              --step-outcome "$STEP_OUTCOME" \
              --missing-report job-failed \
              --report e2e-download/e2e-results.json \
              --body-file /tmp/e2e-pr-comment.md \
              --out ci-section/section.json
          else
            echo "No main e2e JSON report" > /tmp/e2e-pr-comment.md
            node scripts/ci-report-comment.mjs pack \
              --section e2e \
              --step-outcome "$STEP_OUTCOME" \
              --missing-report job-failed \
              --out ci-section/section.json
          fi

      - name: Update CI report comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-report-comment.mjs apply --section e2e --artifact ci-section/section.json
