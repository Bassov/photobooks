name: perf

# Frame-budget / LoAF lane, split from functional e2e (integration.yml).
# Required check `perf` always reports: out-of-scope PRs finish green with
# "not in scope". Thresholds are unchanged (PERF_BUDGETS + LoAF noise rule);
# only the lane is repeated: 3 runs per scenario, red when a scenario fails in
# >=2 runs or any run blocks a frame for >50 ms (scripts/perf-lane.mjs).
# Push runs upload a per-scenario verdict; a PR scenario red on the latest
# main push run and untouched by the PR is reported "pre-existing on main"
# and does not fail the job (scripts/perf-baseline.mjs).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full run on main; red → flake/perf roadmap item (agent-loop.md).
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gh run download of the base branch's perf-verdict artifact (PRs).
  actions: read

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: Bassov/ts-agent-rig/.github/actions/setup-node-pnpm@v0.2.21

      - name: Path filter
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            node scripts/perf-lane.mjs scope "origin/$BASE_REF" | tee -a "$GITHUB_OUTPUT"
          else
            echo "in_scope=true" >> "$GITHUB_OUTPUT"
          fi
          if ! grep -q 'in_scope=true' "$GITHUB_OUTPUT"; then
            echo "perf: not in scope (no render/perf/photo/assets/filmstrip/pasteboard/frame-budget paths touched)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cache Playwright browsers
        if: steps.scope.outputs.in_scope == 'true'
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.scope.outputs.in_scope == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.scope.outputs.in_scope == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build app for E2E
        if: steps.scope.outputs.in_scope == 'true'
        run: pnpm build

      - name: Frame-budget runs (3x, no coverage)
        if: steps.scope.outputs.in_scope == 'true'
        env:
          E2E_COVERAGE: '0'
          E2E_LANE: perf
        run: |
          # Reports live outside test-results/: Playwright wipes that dir per run.
          mkdir -p perf-runs
          for run in 1 2 3; do
            PLAYWRIGHT_JSON_OUTPUT_NAME="perf-runs/run-$run.json" \
              pnpm test:e2e -g "frame-budget gates" || echo "run $run: playwright exit non-zero (judged below)"
          done

      - name: Base perf verdict
        id: base
        if: steps.scope.outputs.in_scope == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Latest finished push run on the base branch (cancelled runs carry no verdict).
          run=$(gh run list --workflow perf.yml --branch "$BASE_REF" --event push \
            --status completed --limit 20 --json databaseId,url,conclusion \
            --jq 'first(.[] | select(.conclusion == "success" or .conclusion == "failure")) | "\(.databaseId) \(.url)"')
          if [ -z "$run" ]; then
            echo "perf: no completed $BASE_REF push run; judging without a baseline"
            exit 0
          fi
          gh run download "${run%% *}" --name perf-verdict --dir perf-base
          echo "url=${run#* }" >> "$GITHUB_OUTPUT"

      - name: Judge runs
        if: steps.scope.outputs.in_scope == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_URL: ${{ steps.base.outputs.url }}
        run: |
          args=()
          if [ "$EVENT_NAME" = "push" ]; then
            args=(--out perf-runs/verdict.json)
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            args=(--base perf-base/verdict.json --base-url "$BASE_URL" --base-ref "origin/$BASE_REF")
          fi
          node scripts/perf-lane.mjs verdict "${args[@]}" perf-runs/run-1.json perf-runs/run-2.json perf-runs/run-3.json

      - name: Upload perf verdict (main baseline)
        if: always() && steps.scope.outputs.in_scope == 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: perf-verdict
          path: perf-runs/verdict.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload frame-pacing stats (report-only)
        if: always() && steps.scope.outputs.in_scope == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: perf-frame-stats
          path: |
            perf-runs/
            test-results/**/perf-frame-stats.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-perf
          path: |
            playwright-report/
            test-results/
          retention-days: 7
