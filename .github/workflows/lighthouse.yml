name: lighthouse

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lighthouse CI
        id: lhci
        run: pnpm test:lhci

      - name: Lighthouse summary
        if: always()
        id: lighthouse_summary
        env:
          LHCI_OUTCOME: ${{ steps.lhci.outcome }}
        run: |
          node scripts/lighthouse-pr-summary.mjs > /tmp/lighthouse-pr-comment.md
          LHR_FILE=$(ls -t .lighthouseci/lhr-*.json 2>/dev/null | head -1 || echo "")
          if [ -n "$LHR_FILE" ]; then
            PERF_SCORE=$(node -p "Math.round(JSON.parse(require('fs').readFileSync('$LHR_FILE', 'utf8')).categories?.performance?.score * 100 || 0)")
            echo "summary=Performance: ${PERF_SCORE}" >> "$GITHUB_OUTPUT"
          else
            echo "summary=Budgets: ${{ steps.lhci.outcome }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update consolidated CI comment
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/update-consolidated-ci-comment.mjs \
            lighthouse \
            ${{ steps.lhci.outcome == 'success' && 'success' || 'failure' }} \
            /tmp/lighthouse-pr-comment.md \
            "${{ steps.lighthouse_summary.outputs.summary }}"
