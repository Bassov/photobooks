name: lighthouse

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lighthouse CI
        id: lhci
        run: pnpm test:lhci

      - name: Lighthouse summary
        if: always()
        env:
          LHCI_OUTCOME: ${{ steps.lhci.outcome }}
        run: node scripts/lighthouse-pr-summary.mjs > /tmp/lighthouse-pr-comment.md

      - name: Sticky Lighthouse comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: lighthouse-ci
          path: /tmp/lighthouse-pr-comment.md
