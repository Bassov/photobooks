name: lighthouse

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lighthouse CI
        id: lhci
        run: pnpm test:lhci

      - name: Lighthouse summary
        if: always()
        run: |
          {
            echo "## Lighthouse CI"
            echo ""
            if [ "${{ steps.lhci.outcome }}" = "success" ]; then
              echo "Budgets passed (\`pnpm test:lhci\`)."
            else
              echo "Budgets failed or job errored — see job logs and \`.lighthouseci/\` if present."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
