name: lighthouse

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: Bassov/ts-agent-rig/.github/actions/setup-node-pnpm@v0.2.0

      - name: Lighthouse CI
        id: lhci
        run: pnpm test:lhci

      - name: Lighthouse summary
        if: always()
        env:
          LHCI_OUTCOME: ${{ steps.lhci.outcome }}
        run: pnpm exec ts-rig-ci lhci-summary > /tmp/lighthouse-pr-comment.md

      - name: Pack Lighthouse section
        if: always()
        uses: Bassov/ts-agent-rig/.github/actions/report-section-pack@v0.2.0
        with:
          section: lighthouse
          step-outcome: ${{ steps.lhci.outcome }}
          missing-report: job-failed
          report-dir: .lighthouseci
          body-file: /tmp/lighthouse-pr-comment.md
          artifact-name: ci-section-lighthouse

  ci-comment:
    needs: lighthouse
    if: always() && github.event_name == 'pull_request' && needs.lighthouse.result != 'cancelled'
    uses: Bassov/ts-agent-rig/.github/workflows/ci-report-comment.yml@v0.2.0
    with:
      section: lighthouse
      artifact-name: ci-section-lighthouse
    secrets: inherit
