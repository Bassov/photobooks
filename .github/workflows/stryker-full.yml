name: stryker-full

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: stryker-full-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  stryker-full:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: Bassov/ts-agent-rig/.github/actions/setup-node-pnpm@v0.2.1

      - name: Full mutation testing
        run: pnpm stryker

      - name: Mutation summary
        if: always()
        run: |
          if [ -f reports/mutation/mutation.json ]; then
            pnpm exec ts-rig-ci stryker-summary
          else
            echo "No mutation report produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Benchmarks
        run: pnpm bench
        env:
          FC_NUM_RUNS: '500'

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 14
