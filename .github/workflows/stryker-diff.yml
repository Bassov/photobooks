name: stryker-diff

on:
  pull_request:

concurrency:
  group: stryker-diff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  stryker-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mutation test changed files
        id: mutate
        run: pnpm stryker:diff

      - name: Mutation summary
        if: always()
        id: summary
        run: |
          if [ ! -f reports/mutation/mutation.json ]; then
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            echo "summary=No report" >> "$GITHUB_OUTPUT"
            echo "No mutation report (empty mutate set or early exit)." >> "$GITHUB_STEP_SUMMARY"
            echo "⏳ No mutation report (empty mutate set or early exit)." > /tmp/stryker-pr-comment.md
          else
            echo "has_report=true" >> "$GITHUB_OUTPUT"
            node scripts/stryker-pr-summary.mjs > /tmp/stryker-pr-comment.md
            SCORE=$(node -p "const r=JSON.parse(require('fs').readFileSync('reports/mutation/mutation.json','utf8'));const f=r.files??{};let k=0,s=0,t=0,n=0;for(const file of Object.values(f)){for(const m of file.mutants??[]){if(m.status==='Killed')k++;else if(m.status==='Survived')s++;else if(m.status==='Timeout'||m.status==='TimedOut')t++;else if(m.status==='NoCoverage')n++}};const d=k+t,v=d+s+n;v===0?100:Math.round((d/v)*1000)/10")
            echo "summary=Score: ${SCORE}%" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Stryker report
        if: always() && steps.summary.outputs.has_report == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 7

      - name: Update consolidated CI comment
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/update-consolidated-ci-comment.mjs \
            mutation \
            ${{ steps.mutate.outcome == 'success' && 'success' || 'failure' }} \
            /tmp/stryker-pr-comment.md \
            "${{ steps.summary.outputs.summary }}"
