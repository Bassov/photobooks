name: stryker-diff

on:
  pull_request:

concurrency:
  group: stryker-diff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  stryker-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: Bassov/ts-agent-rig/.github/actions/setup-node-pnpm@v0.2.0

      - name: Mutation test changed files
        id: mutate
        # Verbose so CI logs keep full Stryker output; report files still under reports/mutation/.
        run: pnpm exec ts-rig-check --verbose --run stryker-diff -- pnpm exec ts-rig-gate stryker-diff

      - name: Mutation summary
        if: always()
        id: summary
        run: |
          if [ ! -f reports/mutation/mutation.json ]; then
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            echo "No mutation report (empty mutate set or early exit)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "has_report=true" >> "$GITHUB_OUTPUT"
          pnpm exec ts-rig-ci stryker-summary > /tmp/stryker-pr-comment.md

      - name: Upload Stryker report
        if: always() && steps.summary.outputs.has_report == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 7

      - name: Pack mutation section
        if: always()
        uses: Bassov/ts-agent-rig/.github/actions/report-section-pack@v0.2.0
        with:
          section: mutation
          step-outcome: ${{ steps.mutate.outcome }}
          missing-report: skipped
          report: reports/mutation/mutation.json
          body-file: /tmp/stryker-pr-comment.md
          artifact-name: ci-section-mutation

  ci-comment:
    needs: stryker-diff
    if: always() && github.event_name == 'pull_request' && needs['stryker-diff'].result != 'cancelled'
    uses: Bassov/ts-agent-rig/.github/workflows/ci-report-comment.yml@v0.2.0
    with:
      section: mutation
      artifact-name: ci-section-mutation
    secrets: inherit
