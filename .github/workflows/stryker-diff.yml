name: stryker-diff

on:
  pull_request:

concurrency:
  group: stryker-diff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  stryker-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mutation test changed files
        id: mutate
        # Verbose so CI logs keep full Stryker output; report files still under reports/mutation/.
        run: node scripts/check.mjs --verbose --run stryker-diff -- node scripts/stryker-diff.mjs

      - name: Mutation summary
        if: always()
        id: summary
        run: |
          if [ ! -f reports/mutation/mutation.json ]; then
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            echo "No mutation report (empty mutate set or early exit)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "has_report=true" >> "$GITHUB_OUTPUT"
          node scripts/stryker-pr-summary-cli.mjs > /tmp/stryker-pr-comment.md

      - name: Upload Stryker report
        if: always() && steps.summary.outputs.has_report == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 7

      - name: Pack mutation section
        if: always()
        run: |
          node scripts/ci-report-comment.mjs pack \
            --section mutation \
            --step-outcome "${{ steps.mutate.outcome }}" \
            --missing-report skipped \
            --report reports/mutation/mutation.json \
            --body-file /tmp/stryker-pr-comment.md \
            --out ci-section/section.json

      - name: Upload mutation section
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-section-mutation
          path: ci-section/section.json
          retention-days: 1
          if-no-files-found: ignore

  ci-comment:
    needs: stryker-diff
    if: always() && github.event_name == 'pull_request' && needs['stryker-diff'].result != 'cancelled'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-report-${{ github.event.pull_request.number }}
      queue: max
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download mutation section
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ci-section-mutation
          path: ci-section

      - name: Update CI report comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-report-comment.mjs apply --section mutation --artifact ci-section/section.json
